<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Inpainting Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .upload-section {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="file"] {
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .brush-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="range"] {
            width: 120px;
            cursor: pointer;
        }

        .canvas-area {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
        }

        .canvas-label {
            text-align: center;
            font-weight: 600;
            color: #666;
            margin-bottom: 10px;
            font-size: 14px;
        }

        canvas {
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: crosshair;
            max-width: 100%;
            display: block;
            background: #f5f5f5;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: 600;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .secondary-btn {
            background: #6c757d;
        }

        .secondary-btn:hover {
            background: #5a6268;
        }

        .warning-text {
            color: #666;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .canvas-area {
                gap: 15px;
            }

            canvas {
                max-width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Image Inpainting Tool</h1>

        <div class="controls">
            <div class="upload-section">
                <input type="file" id="imageInput" accept="image/*" />
                <button onclick="loadImage()">Load Image</button>
            </div>

            <div class="brush-controls">
                <label for="brushSize">Brush Size:</label>
                <input type="range" id="brushSize" min="5" max="100" value="20" />
                <span id="brushSizeValue">20</span>px
            </div>

            <div class="button-group">
                <button class="secondary-btn" onclick="clearMask()">Clear Mask</button>
                <button onclick="inpaint()" id="inpaintBtn">Inpaint</button>
            </div>
        </div>

        <div class="canvas-area">
            <div class="canvas-container">
                <div class="canvas-label">Original Image</div>
                <canvas id="imageCanvas" width="512" height="512"></canvas>
            </div>

            <div class="canvas-container">
                <div class="canvas-label">Mask (Draw to inpaint)</div>
                <canvas id="maskCanvas" width="512" height="512"></canvas>
            </div>

            <div class="canvas-container" id="resultContainer" style="display: none;">
                <div class="canvas-label">Inpainted Result</div>
                <canvas id="resultCanvas" width="512" height="512"></canvas>
            </div>
        </div>

        <div class="status" id="status"></div>
        <div class="warning-text">Draw on the mask canvas to mark areas you want to remove. The AI will inpaint those areas.</div>
    </div>

    <script>
        const imageCanvas = document.getElementById('imageCanvas');
        const maskCanvas = document.getElementById('maskCanvas');
        const resultCanvas = document.getElementById('resultCanvas');
        const imageInput = document.getElementById('imageInput');
        const brushSizeInput = document.getElementById('brushSize');
        const statusDiv = document.getElementById('status');
        const resultContainer = document.getElementById('resultContainer');

        const imageCtx = imageCanvas.getContext('2d');
        const maskCtx = maskCanvas.getContext('2d');
        const resultCtx = resultCanvas.getContext('2d');

        let isDrawing = false;
        let originalImage = null;

        // Update brush size display
        brushSizeInput.addEventListener('input', (e) => {
            document.getElementById('brushSizeValue').textContent = e.target.value;
        });

        // Image upload
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    originalImage = new Image();
                    originalImage.onload = () => {
                        // Resize canvas to fit image
                        const maxSize = 512;
                        let width = originalImage.width;
                        let height = originalImage.height;

                        if (width > height) {
                            height = (height / width) * maxSize;
                            width = maxSize;
                        } else {
                            width = (width / height) * maxSize;
                            height = maxSize;
                        }

                        imageCanvas.width = width;
                        imageCanvas.height = height;
                        maskCanvas.width = width;
                        maskCanvas.height = height;

                        // Draw original image
                        imageCtx.drawImage(originalImage, 0, 0, width, height);

                        // Clear mask
                        maskCtx.fillStyle = 'black';
                        maskCtx.fillRect(0, 0, width, height);

                        resultContainer.style.display = 'none';
                        showStatus('Image loaded!', 'success');
                    };
                    originalImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Mouse events for drawing
        maskCanvas.addEventListener('mousedown', (e) => {
            if (!originalImage) return;
            isDrawing = true;
            const rect = maskCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            drawOnMask(x, y);
        });

        maskCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || !originalImage) return;
            const rect = maskCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            drawOnMask(x, y);
        });

        maskCanvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        maskCanvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });

        // Touch events for mobile
        maskCanvas.addEventListener('touchstart', (e) => {
            if (!originalImage) return;
            isDrawing = true;
            const rect = maskCanvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            drawOnMask(x, y);
        });

        maskCanvas.addEventListener('touchmove', (e) => {
            if (!isDrawing || !originalImage) return;
            const rect = maskCanvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            drawOnMask(x, y);
            e.preventDefault();
        });

        maskCanvas.addEventListener('touchend', () => {
            isDrawing = false;
        });

        function drawOnMask(x, y) {
            const brushSize = parseInt(brushSizeInput.value);
            maskCtx.fillStyle = 'white';
            maskCtx.beginPath();
            maskCtx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
            maskCtx.fill();
        }

        function clearMask() {
            if (!originalImage) return;
            maskCtx.fillStyle = 'black';
            maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
            showStatus('Mask cleared!', 'success');
        }

        async function loadImage() {
            if (!imageInput.value) {
                showStatus('Please select an image first', 'error');
            }
        }

        async function inpaint() {
            if (!originalImage) {
                showStatus('Please load an image first', 'error');
                return;
            }

            showStatus('Processing... This may take a minute.', 'loading');
            document.getElementById('inpaintBtn').disabled = true;

            try {
                // Get canvas data as base64
                const imageData = imageCanvas.toDataURL('image/png');
                const maskData = maskCanvas.toDataURL('image/png');

                const response = await fetch('/inpaint', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image: imageData,
                        mask: maskData
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.statusText}`);
                }

                const result = await response.json();

                if (result.success) {
                    const resultImage = new Image();
                    resultImage.onload = () => {
                        resultCanvas.width = resultImage.width;
                        resultCanvas.height = resultImage.height;
                        resultCtx.drawImage(resultImage, 0, 0);
                        resultContainer.style.display = 'block';
                        showStatus('Inpainting complete!', 'success');
                    };
                    resultImage.src = result.result;
                } else {
                    showStatus('Error: ' + (result.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            } finally {
                document.getElementById('inpaintBtn').disabled = false;
            }
        }

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status show ${type}`;
            setTimeout(() => {
                statusDiv.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
